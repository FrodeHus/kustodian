name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the KQL query and source (Graph, hunting, Resource Graph) if relevant. Remove tenant-specific data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kustodian version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the run's Diagnostics tab if it helps. It never contains tokens, but check for tenant data first.
      render: text
