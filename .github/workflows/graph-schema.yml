name: graph-schema

# Daily: regenerates the bundled Graph schema with tools/schema and, when it changed, opens (or updates) a pull request
# from bot/graph-schema with an Unreleased note. A run where only the metadata commit moved changes nothing.
#
# Pull requests opened with the default GITHUB_TOKEN don't trigger ci or changelog, so the tests run here. A failure still
# opens the pull request and says so: schema changes can move numbers pinned in tests (the Entra app permission plan) that a
# person has to update. Set the
# SCHEMA_PR_TOKEN secret (a fine-grained token with contents and pull requests write) to have those checks run on the pull
# request too. Without it, "Allow GitHub Actions to create and approve pull requests" must be on in the repository's
# Actions settings.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graph-schema
  cancel-in-progress: false

env:
  BRANCH: bot/graph-schema

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SCHEMA_PR_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Regenerate the schema
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project tools/schema | tee "$RUNNER_TEMP/schema.txt"

      # graph-permissions.json is rewritten on every run with the new source, so only a schema change counts.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/Kustodian.Graph/Schema/graph-beta.json; then
            git checkout -- src/Kustodian.Graph/Schema
            echo "The Graph schema is unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(sed -n 's/^Source: msgraph-metadata@\([0-9a-f]\{7\}\).*/\1/p' "$RUNNER_TEMP/schema.txt")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Photino dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsecret-1-dev

      - name: Test
        id: test
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: dotnet test 2>&1 | tee "$RUNNER_TEMP/test.txt"

      # Adds the note under "### Changed" in Unreleased, making that heading when it isn't there.
      - name: Add an Unreleased note
        if: steps.changes.outputs.changed == 'true'
        env:
          NOTE: "- The Graph schema is regenerated from the latest beta metadata (msgraph-metadata@${{ steps.changes.outputs.commit }})."
        run: |
          awk -v note="$NOTE" '
            done { print; next }
            /^## \[Unreleased\]/ { print; unreleased = 1; next }
            unreleased && /^### Changed/ { print; getline; print; print note; done = 1; next }
            unreleased && /^## / { print "### Changed"; print ""; print note; print ""; print; done = 1; next }
            { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCHEMA_PR_TOKEN || github.token }}
          COMMIT: ${{ steps.changes.outputs.commit }}
          TESTS: ${{ steps.test.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Update the Graph schema to msgraph-metadata@$COMMIT"
          git push --force origin "$BRANCH"
          {
            echo "Regenerated by the graph-schema workflow with \`tools/schema\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/schema.txt"
            echo '```'
            echo
            if [[ "$TESTS" == "success" ]]; then
              echo "All tests passed in the run."
            else
              echo "**Tests failed in the run.** Update the numbers the new schema moved before merging:"
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test.txt" | grep -E "^(failed |  Expected|  Actual)" | head -40 || true
              echo '```'
            fi
          } > "$RUNNER_TEMP/body.md"
          title="Update the Graph schema to msgraph-metadata@$COMMIT"
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
