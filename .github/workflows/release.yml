name: release

# Builds every package from one commit and creates a draft GitHub release with all of them and SHA256SUMS.txt. Runs on a
# pushed `v<version>` tag. The tagged commit must be on main, match the project's version (Directory.Build.props) and
# have a CHANGELOG.md section for it; the version job refuses anything else before a build starts. Nothing is
# published: the owner reviews the draft and publishes it.
#
# Running the workflow by hand with a version does the steps before the tag as well: it checks that main is green, runs
# tools/release/cut-release.sh (the Unreleased changelog entries move under the new version, and Directory.Build.props
# gets it), commits that to main and pushes the tag. That tag push starts a second run, which builds and drafts the
# release; the manual run ends after the tag. Both pushes use the RELEASE_DEPLOY_KEY deploy key, which the main ruleset
# lets bypass the pull-request requirement (the workflow token cannot, and a tag pushed with it would start no run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Cut the release and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Every tag is v<x.y.z>, so a version typed with the v is the natural mistake; accept both. The typed input stays
      # in $VERSION, an environment variable, never expanded into the script.
      - name: Check the version and the tag
        run: |
          if ! [[ "${VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.y.z or vx.y.z, got '$VERSION'"
            exit 1
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      # "main is green": the latest ci run on main must have finished and passed, and be for the commit being released.
      - name: Check that main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --workflow ci.yml --branch main --event push --limit 1 --json status,conclusion,headSha,url --jq '.[0]')"
          if [[ -z "$run" || "$run" == "null" ]]; then
            echo "::error::ci has not run on main"
            exit 1
          fi
          status="$(jq -r .status <<<"$run")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          sha="$(jq -r .headSha <<<"$run")"
          url="$(jq -r .url <<<"$run")"
          if [[ "$status" != "completed" ]]; then
            echo "::error::ci is still $status on main: $url"
            exit 1
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::ci last ended with $conclusion on main: $url"
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [[ "$sha" != "$head" ]]; then
            echo "::error::ci's last run on main is for ${sha:0:7}, not ${head:0:7}; wait for ci on the latest commit"
            exit 1
          fi
          echo "ci: success (${sha:0:7})"

      - name: Cut the release
        run: tools/release/cut-release.sh "$VERSION"

      - name: Configure the deploy key
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::RELEASE_DEPLOY_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" >~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan -t ed25519,rsa github.com >>~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes" >>"$GITHUB_ENV"
          git remote set-url origin "git@github.com:$REPO.git"

      - name: Commit the release and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Directory.Build.props
          git commit -m "chore: version $VERSION"
          git tag -a "v$VERSION" -m "Kustodian $VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "Pushed v$VERSION; the tag run builds and drafts the release." >>"$GITHUB_STEP_SUMMARY"

  # Everything after this job signs with the release certificate and drafts the release. Only a commit that already
  # reached main, through a pull request or the manual run above, may get there; any other tag stops here.
  version:
    name: Check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag against main, the project version and the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # fetch-depth 0 fetched every branch, so origin/main is already present.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main && rc=0 || rc=$?
          if [[ "$rc" -eq 1 ]]; then
            echo "::error::$TAG points at $(git rev-parse --short "$GITHUB_SHA"), which is not on main; only tags on main are released"
            exit 1
          elif [[ "$rc" -ne 0 ]]; then
            echo "::error::git merge-base failed with status $rc"
            exit "$rc"
          fi
          version="$(dotnet msbuild src/Kustodian/Kustodian.csproj -getProperty:Version | tr -d '[:space:]')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the project version (got '$version')"
            exit 1
          fi
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match the project version $version (Directory.Build.props)"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md at $TAG has no \"## [$version]\" section; run tools/release/cut-release.sh first"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Version $version"

  windows:
    name: Windows (MSIs and portable zips)
    timeout-minutes: 60
    needs: version
    runs-on: windows-latest
    # One Certum SimplySign account serves every signing job, and a TOTP code is single-use: two overlapping logins make
    # the loser read "invalid user name or token". Hold signing to one login at a time.
    concurrency:
      group: certum-simplysign
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install WiX
        # v5: later majors require accepting the Open Source Maintenance Fee EULA.
        run: dotnet tool install --global wix --version 5.0.2

      # Windows signing: a Certum code-signing certificate held in Certum's cloud (SimplySign). Connect-SimplySign.ps1
      # opens the session on the runner from the account name and the TOTP seed, after which signtool finds the
      # certificate by thumbprint like any other. Without all three secrets the MSIs ship unsigned.
      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          if ($env:CERTUM_USERNAME -and $env:CERTUM_OTP_URI -and $env:CERTUM_KEY_ID) {
            "SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "signed=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Certum signing secrets not configured; building unsigned MSIs."
            "signed=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Portable zips
        shell: bash
        run: |
          for rid in win-x64 win-arm64; do
            tools/release/package.sh "$rid"
          done

      # signtool is not on the runner's PATH: add the newest x64 one from the Windows SDK.
      - name: Open the SimplySign session
        if: env.SIGN == '1'
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          ./tools/release/windows/Connect-SimplySign.ps1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          $signtool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: MSIs
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          $sign = $env:SIGN -eq '1'
          ./tools/release/windows/build.ps1 -Version $env:VERSION -Sign:$sign

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            artifacts/Kustodian-*.msi
            artifacts/Kustodian-*.msi.sha256
            artifacts/Kustodian-*.zip
          if-no-files-found: error

  macos:
    name: macOS (app zips and dmgs)
    timeout-minutes: 60
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Packages
        run: |
          for rid in osx-arm64 osx-x64; do
            tools/release/package.sh "$rid"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            artifacts/Kustodian-*.zip
            artifacts/Kustodian-*.dmg
          if-no-files-found: error

  linux:
    name: Linux (tarball and AppImage)
    timeout-minutes: 60
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Photino dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsecret-1-dev

      - name: Packages
        run: tools/release/package.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            artifacts/Kustodian-*.tar.gz
            artifacts/Kustodian-*.AppImage
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WIN_SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          tools/release/checksums.sh
          cat artifacts/SHA256SUMS.txt

      - name: Release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            # The changelog section for this version, when there is one.
            awk -v v="$VERSION" '
              /^## \[/ { on = (index($0, "## [" v "]") == 1); next }
              on { print }
            ' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "See the [install guide](https://github.com/$REPO/blob/v$VERSION/docs/install.md) for every platform."
            echo
            echo "- **Windows 11:** \`Kustodian-$VERSION-x64.msi\` or \`Kustodian-$VERSION-arm64.msi\` (installs per user, no admin rights), or the portable \`Kustodian-$VERSION-win-x64.zip\` / \`-win-arm64.zip\`."
            echo "- **macOS 14 or later:** \`Kustodian-$VERSION-osx-arm64.dmg\` (Apple silicon) or \`Kustodian-$VERSION-osx-x64.dmg\` (Intel); the same app is in the \`.zip\` files."
            echo "- **Linux x64:** \`Kustodian-$VERSION-x86_64.AppImage\` or \`Kustodian-$VERSION-linux-x64.tar.gz\`. Needs WebKitGTK 4.1, libsecret and libnotify from your distribution. The AppImage runs without FUSE (it extracts itself); with fuse3's fusermount, which WebKitGTK usually brings, it mounts instead."
            echo
            echo "## Signing"
            echo
            echo "macOS: not notarized (ad-hoc signature). The first open is blocked; choose System Settings -> Privacy & Security -> Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Kustodian.app\`."
            echo
            if [ "$WIN_SIGNED" = "1" ]; then
              echo 'Windows: the MSIs, and the Kustodian.exe they install, are code-signed (Certum). The portable zips are not signed. SmartScreen can still warn about a new release; choose **More info**, then **Run anyway**.'
            else
              echo 'Windows: the MSIs and the portable zips are **not code-signed**. SmartScreen shows "Windows protected your PC"; choose **More info**, then **Run anyway**.'
            fi
            echo
            echo '## Verify'
            echo
            echo "Download \`SHA256SUMS.txt\` next to the packages and run \`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\` (or \`sha256sum -c --ignore-missing SHA256SUMS.txt\` on Linux)."
          } >notes.md
          cat notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION"
          artifacts/Kustodian-*
          artifacts/SHA256SUMS.txt
          --draft
          --target "$GITHUB_SHA"
          --title "Kustodian $VERSION"
          --notes-file notes.md
